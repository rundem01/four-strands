<script>
/* match the app's saved theme before paint, no flash */
(function(){
  try{
    var dark=false, raw=localStorage.getItem('four-strands-log');
    if(raw){var p=JSON.parse(raw); if(p&&p._prefs){dark=!!p._prefs.dark;}}
    else if(window.matchMedia&&matchMedia('(prefers-color-scheme:dark)').matches){dark=true;}
    if(dark){document.documentElement.className='dark';
      var m=document.getElementById('meta-theme'); if(m)m.setAttribute('content','#141A16');}
  }catch(e){}
})();
</script>
<style>
  :root{
    --limewash:#E8E9E4;--ink:#1B2A22;--ink-soft:#5A6A60;--hair:#C3C7BC;
    --scripture:#7A5C3E;--iron:#2F4B7C;--food:#6E8B3D;--sleep:#4A3F6B;
    --display:'Bricolage Grotesque','Arial Narrow',Helvetica,sans-serif;
    --body:'Public Sans',system-ui,-apple-system,sans-serif;
    --mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  }
  html.dark{
    --limewash:#141A16;--ink:#E2E5DC;--ink-soft:#8A9990;--hair:#333D36;
    --scripture:#B98A5C;--iron:#5B82C4;--food:#9BC05C;--sleep:#9083C9;
  }
  *{box-sizing:border-box;margin:0}
  html,body{background:var(--limewash)}
  body{font-family:var(--body);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
  .shell{width:100%;max-width:600px;margin:0 auto;padding:24px 20px 44px;flex:1;display:flex;flex-direction:column}
  .top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--hair);padding-bottom:11px}
  .brand{font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:-.01em;color:var(--ink);text-decoration:none}
  .back{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);text-decoration:none}
  .back:hover,.back:focus-visible{color:var(--ink)}
  .kicker{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-soft);margin:34px 0 14px}
  .weave-rule{display:flex;gap:5px;margin:0 0 26px}
  .weave-rule i{height:5px;flex:1;border-radius:2px;display:block}
  .weave-rule i:nth-child(1){background:var(--scripture)}
  .weave-rule i:nth-child(2){background:var(--iron)}
  .weave-rule i:nth-child(3){background:var(--food)}
  .weave-rule i:nth-child(4){background:var(--sleep)}
  h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,8vw,44px);line-height:.98;letter-spacing:-.03em;margin-bottom:14px}
  h2{font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:-.01em;margin:26px 0 8px}
  p{margin:0 0 14px}
  .muted{color:var(--ink-soft)}
  a{color:var(--iron)}
  ul{padding-left:18px;margin:0 0 14px}
  li{margin-bottom:6px}
  .lede{border-left:3px solid var(--scripture);background:rgba(0,0,0,.025);padding:14px 16px;margin-bottom:22px}
  html.dark .lede{background:rgba(255,255,255,.035)}
  .lede p{margin:0}
  .foot{margin-top:auto;padding-top:20px;border-top:1px solid var(--hair);display:flex;gap:16px;flex-wrap:wrap;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
  .foot a{color:var(--ink-soft);text-decoration:none}
  .foot a:hover,.foot a:focus-visible{color:var(--ink)}
  .foot a[aria-current]{color:var(--ink)}
  :focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .cta{display:inline-block;font-family:var(--display);font-weight:700;font-size:16px;background:var(--ink);color:var(--limewash);border-radius:8px;padding:11px 18px;text-decoration:none;margin:6px 0 10px}
  .frayed{display:flex;gap:5px;margin:0 0 26px;height:20px;align-items:flex-start}
  .frayed i{flex:1;border-radius:2px;height:5px}
  .frayed i:nth-child(1){background:var(--scripture)}
  .frayed i:nth-child(2){background:var(--iron);height:5px;align-self:flex-end}
  .frayed i:nth-child(3){background:var(--food)}
  .frayed i:nth-child(4){background:var(--sleep);align-self:center}
</style>
</head>

</html>
